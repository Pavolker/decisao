[build]
  command = "rm -f package-lock.json && npm install --include=optional && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/openai"
  to = "/.netlify/functions/groq"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--include=optional"
  ROLLUP_DISABLE_NATIVE = "1"
